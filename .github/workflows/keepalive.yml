# Keeps the free Render web service awake.
#
# Render spins a free instance down after ~15 minutes without traffic, and the
# next visitor waits through a 30-60s cold start. A request every 10 minutes
# keeps it warm; `/api/health` touches no database and no provider, so this
# cannot inflate Supabase or AI usage.
#
# The schedule lives in the repo, not in a Render setting, so nothing has to be
# clicked in a dashboard. GitHub disables scheduled workflows after 60 days of
# repository inactivity; touching any file, or re-enabling the workflow from the
# Actions tab, restarts it.

name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          set -euo pipefail
          url="https://aegis22.onrender.com/api/health"
          # A cold start can take a minute to accept the connection, so allow a
          # single retry before calling it down.
          for attempt in 1 2 3; do
            code=$(curl -sS -m 90 -o /tmp/health.json -w "%{http_code}" "$url" || echo "000")
            echo "attempt $attempt -> $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 20
          done
          echo "service did not return 200 after 3 attempts" >&2
          exit 1
